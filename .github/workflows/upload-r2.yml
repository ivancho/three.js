name: Upload changed files to R2

on:
  workflow_dispatch:
    inputs:
      destination_folder:
        description: Destination folder prefix in the R2 bucket
        required: true
        type: string
      compare_ref:
        description: Git ref to diff against (defaults to previous commit)
        required: false
        type: string
      path_prefix:
        description: Only upload changed files under this path prefix (optional)
        required: false
        type: string
        default: ''
      path_rewrites:
        description: JSON object of path rewrite rules (e.g. {"examples/":"","files":"examples/files"})
        required: false
        type: string
        default: ''
      ignore:
        description: gitignore-style patterns (one per line) of files/folders to skip uploading
        required: false
        type: string
        default: ''
      public_base_url:
        description: Public URL prefix for DESTINATION_FOLDER (used for Cloudflare cache purge)
        required: false
        type: string
        default: ''
  push:
    branches:
      - conics

permissions:
  contents: read

jobs:
  upload:
    name: Upload changed files
    runs-on: ubuntu-latest
    # Skip when push has no configured destination folder
    if: github.event_name == 'workflow_dispatch' || vars.R2_DESTINATION_FOLDER != ''
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DESTINATION_FOLDER: ${{ github.event.inputs.destination_folder || vars.R2_DESTINATION_FOLDER }}
      PATH_PREFIX: ${{ github.event.inputs.path_prefix || vars.R2_UPLOAD_PATH_PREFIX || '' }}
      PATH_REWRITES: ${{ github.event.inputs.path_rewrites || vars.R2_PATH_REWRITES || '{}' }}
      PATH_IGNORE: ${{ github.event.inputs.ignore || vars.R2_IGNORE || '' }}
      R2_PUBLIC_BASE_URL: ${{ github.event.inputs.public_base_url || vars.R2_PUBLIC_BASE_URL || '' }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID || vars.CF_ZONE_ID }}
    steps:
      - name: Git checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Validate configuration
        run: |
          missing=()
          [ -z "$R2_ACCOUNT_ID" ] && missing+=(R2_ACCOUNT_ID)
          [ -z "$R2_ACCESS_KEY_ID" ] && missing+=(R2_ACCESS_KEY_ID)
          [ -z "$R2_SECRET_ACCESS_KEY" ] && missing+=(R2_SECRET_ACCESS_KEY)
          [ -z "$R2_BUCKET" ] && missing+=(R2_BUCKET)
          [ -z "$DESTINATION_FOLDER" ] && missing+=(destination_folder)

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required configuration: ${missing[*]}"
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys
          raw = os.environ.get("PATH_REWRITES") or "{}"
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"PATH_REWRITES is not valid JSON: {e}")
              sys.exit(1)
          if not isinstance(data, dict):
              print("PATH_REWRITES must be a JSON object of key:value path rewrites")
              sys.exit(1)
          for key, value in data.items():
              if not isinstance(key, str) or not isinstance(value, str):
                  print("PATH_REWRITES keys and values must be strings")
                  sys.exit(1)
          print(f"Path rewrites: {data}")

          ignore_raw = os.environ.get("PATH_IGNORE") or ""
          ignore_lines = [
              line for line in ignore_raw.splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]
          print(f"Ignore patterns ({len(ignore_lines)}):")
          for line in ignore_lines:
              print(f"  {line}")

          public_base = os.environ.get("R2_PUBLIC_BASE_URL") or ""
          cf_token = os.environ.get("CF_API_TOKEN") or ""
          cf_zone = os.environ.get("CF_ZONE_ID") or ""
          if public_base and cf_token and cf_zone:
              print(f"Cloudflare purge enabled for: {public_base.rstrip('/')}/...")
          else:
              print(
                  "Cloudflare purge not fully configured "
                  "(needs CF_API_TOKEN, CF_ZONE_ID, R2_PUBLIC_BASE_URL); will skip after upload."
              )
          PY

      - name: Collect changed files
        id: changed
        env:
          COMPARE_REF: ${{ github.event.inputs.compare_ref }}
        run: |
          if [ -n "$COMPARE_REF" ]; then
            base="$COMPARE_REF"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
              base="HEAD~1"
            fi
          else
            base="HEAD~1"
          fi

          echo "Diffing against: $base"

          git diff --name-only --diff-filter=ACMR "$base" HEAD > changed_files.txt

          if [ -n "$PATH_PREFIX" ]; then
            prefix="${PATH_PREFIX%/}/"
            while IFS= read -r file; do
              case "$file" in
                "${prefix}"*) echo "$file" ;;
              esac
            done < changed_files.txt > filtered_files.txt
            mv filtered_files.txt changed_files.txt
          fi

          if [ -n "$PATH_IGNORE" ]; then
            python3 -m pip install --user --quiet pathspec
            python3 <<'PY'
          import os
          import pathspec

          raw = os.environ.get("PATH_IGNORE") or ""
          patterns = [
              line.rstrip("\n")
              for line in raw.splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]
          spec = pathspec.PathSpec.from_lines("gitwildmatch", patterns)

          kept = []
          ignored = []
          with open("changed_files.txt", encoding="utf-8") as handle:
              for file_path in handle:
                  file_path = file_path.strip()
                  if not file_path:
                      continue
                  if spec.match_file(file_path):
                      ignored.append(file_path)
                  else:
                      kept.append(file_path)

          with open("changed_files.txt", "w", encoding="utf-8") as handle:
              for file_path in kept:
                  handle.write(file_path + "\n")

          if ignored:
              print("Ignored by R2_IGNORE:")
              for file_path in ignored:
                  print(f"  {file_path}")
          print(f"Kept {len(kept)} file(s) after ignore filter.")
          PY
          fi

          if [ ! -s changed_files.txt ]; then
            echo "No changed files to upload."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          cat changed_files.txt
          echo "has_files=true" >> "$GITHUB_OUTPUT"

      - name: Install AWS CLI
        if: steps.changed.outputs.has_files == 'true'
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Prepare upload mappings
        id: mappings
        if: steps.changed.outputs.has_files == 'true'
        env:
          DESTINATION: ${{ env.DESTINATION_FOLDER }}
        run: |
          export DESTINATION="${DESTINATION_FOLDER%/}"
          python3 <<'PY'
          import json, os, re, sys

          rewrites = json.loads(os.environ.get("PATH_REWRITES") or "{}")
          destination = os.environ["DESTINATION"].rstrip("/")
          errors = []
          mappings = []

          with open("changed_files.txt", encoding="utf-8") as handle:
              for file_path in handle:
                  file_path = file_path.strip()
                  if not file_path or not os.path.isfile(file_path):
                      continue

                  if "/" in file_path:
                      directory, filename = file_path.rsplit("/", 1)
                      directory = directory + "/"
                  else:
                      directory, filename = "", file_path

                  matches = [key for key in rewrites if key in directory]
                  if len(matches) > 1:
                      errors.append(
                          f"{file_path}: directory '{directory}' matches multiple rewrite keys: {matches}"
                      )
                      continue

                  if len(matches) == 1:
                      key = matches[0]
                      directory = directory.replace(key, rewrites[key], 1)

                  remote = re.sub(r"/{2,}", "/", f"{directory}{filename}").strip("/")
                  object_key = f"{destination}/{remote}" if destination else remote
                  object_key = re.sub(r"/{2,}", "/", object_key).strip("/")
                  mappings.append((file_path, object_key, remote))

          if errors:
              print("Path rewrite conflicts detected; aborting before any uploads:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)

          if not mappings:
              print("No uploadable files after mapping.")
              sys.exit(1)

          with open("upload_mappings.tsv", "w", encoding="utf-8") as out:
              for file_path, object_key, remote in mappings:
                  out.write(f"{file_path}\t{object_key}\t{remote}\n")
                  print(f"{file_path} -> {object_key}")

          print(f"Prepared {len(mappings)} file mapping(s).")
          PY

      - name: Upload to R2
        id: upload
        if: steps.changed.outputs.has_files == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DESTINATION: ${{ env.DESTINATION_FOLDER }}
        run: |
          export DESTINATION="${DESTINATION_FOLDER%/}"
          export BUCKET="$R2_BUCKET"
          export ENDPOINT="$R2_ENDPOINT"
          export RUN_ID

          python3 <<'PY'
          import os
          import subprocess
          import sys

          bucket = os.environ["BUCKET"]
          endpoint = os.environ["ENDPOINT"]
          destination = os.environ["DESTINATION"].rstrip("/")
          run_id = os.environ["RUN_ID"]
          staging_root = "/".join(
              part for part in (destination, ".r2-upload-staging", run_id) if part
          )
          backup_root = "/".join(
              part for part in (destination, ".r2-upload-backup", run_id) if part
          )

          # Overwrite-in-place deploys: keep browser/CDN from serving stale copies.
          NO_CACHE = "no-cache"
          SHORT_CACHE = "public, max-age=300"
          NO_CACHE_EXTS = {
              ".html", ".htm",
              ".js", ".mjs", ".cjs", ".css",
              ".json", ".map", ".wasm", ".svg",
              ".txt", ".xml", ".webmanifest",
          }


          def cache_control_for(path):
              ext = os.path.splitext(path)[1].lower()
              if ext in NO_CACHE_EXTS:
                  return NO_CACHE
              return SHORT_CACHE


          mappings = []
          with open("upload_mappings.tsv", encoding="utf-8") as handle:
              for line in handle:
                  line = line.strip()
                  if not line:
                      continue
                  local_path, final_key, remote = line.split("\t")
                  staging_key = f"{staging_root}/{remote}"
                  backup_key = f"{backup_root}/{remote}"
                  mappings.append(
                      {
                          "local": local_path,
                          "final": final_key,
                          "staging": staging_key,
                          "backup": backup_key,
                          "remote": remote,
                          "cache_control": cache_control_for(local_path),
                      }
                  )


          def run_aws(args, check=True):
              cmd = ["aws", "s3", *args, "--endpoint-url", endpoint]
              print("+", " ".join(cmd))
              return subprocess.run(cmd, check=check)


          def object_exists(key):
              result = subprocess.run(
                  [
                      "aws", "s3api", "head-object",
                      "--bucket", bucket,
                      "--key", key,
                      "--endpoint-url", endpoint,
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return result.returncode == 0


          def delete_prefix(prefix):
              run_aws(["rm", f"s3://{bucket}/{prefix}", "--recursive"], check=False)


          backed_up = []
          staged = []
          promoted = []

          def rollback():
              print("Upload failed; rolling back changes from this run...")
              for item in reversed(promoted):
                  if item in backed_up:
                      run_aws(
                          [
                              "cp",
                              f"s3://{bucket}/{item['backup']}",
                              f"s3://{bucket}/{item['final']}",
                          ],
                          check=False,
                      )
                  else:
                      run_aws(["rm", f"s3://{bucket}/{item['final']}"], check=False)
              delete_prefix(staging_root)
              delete_prefix(backup_root)


          try:
              print("Backing up existing destination objects...")
              for item in mappings:
                  if object_exists(item["final"]):
                      run_aws(
                          [
                              "cp",
                              f"s3://{bucket}/{item['final']}",
                              f"s3://{bucket}/{item['backup']}",
                          ]
                      )
                      backed_up.append(item)

              print("Uploading all files to staging with Cache-Control...")
              for item in mappings:
                  run_aws(
                      [
                          "cp",
                          item["local"],
                          f"s3://{bucket}/{item['staging']}",
                          "--cache-control",
                          item["cache_control"],
                      ]
                  )
                  print(f"  Cache-Control: {item['cache_control']} ({item['local']})")
                  staged.append(item)

              print("Promoting staged files to final keys...")
              for item in mappings:
                  # REPLACE keeps the Cache-Control set on the staged object.
                  run_aws(
                      [
                          "cp",
                          f"s3://{bucket}/{item['staging']}",
                          f"s3://{bucket}/{item['final']}",
                          "--metadata-directive",
                          "COPY",
                      ]
                  )
                  promoted.append(item)

              with open("purge_remotes.txt", "w", encoding="utf-8") as out:
                  for item in mappings:
                      out.write(item["remote"] + "\n")

              print("Cleaning up staging and backup prefixes...")
              delete_prefix(staging_root)
              delete_prefix(backup_root)
              print(f"Successfully uploaded {len(mappings)} file(s).")
          except Exception as exc:
              print(f"Error during atomic upload: {exc}", file=sys.stderr)
              rollback()
              sys.exit(1)
          PY

      - name: Purge Cloudflare cache
        if: steps.changed.outputs.has_files == 'true' && steps.upload.outcome == 'success'
        env:
          PUBLIC_BASE_URL: ${{ env.R2_PUBLIC_BASE_URL }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ] || [ -z "$PUBLIC_BASE_URL" ]; then
            echo "Skipping Cloudflare purge (set CF_API_TOKEN, CF_ZONE_ID, and R2_PUBLIC_BASE_URL to enable)."
            echo "  CF_API_TOKEN set: $([ -n "$CF_API_TOKEN" ] && echo yes || echo no)"
            echo "  CF_ZONE_ID set: $([ -n "$CF_ZONE_ID" ] && echo yes || echo no)"
            echo "  R2_PUBLIC_BASE_URL set: $([ -n "$PUBLIC_BASE_URL" ] && echo yes || echo no)"
            exit 0
          fi

          if [ ! -f purge_remotes.txt ]; then
            echo "No purge_remotes.txt; nothing to purge."
            exit 0
          fi

          export PUBLIC_BASE_URL
          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ["CF_API_TOKEN"]
          zone_id = os.environ["CF_ZONE_ID"]
          base = os.environ["PUBLIC_BASE_URL"].rstrip("/")

          urls = []
          with open("purge_remotes.txt", encoding="utf-8") as handle:
              for line in handle:
                  remote = line.strip().lstrip("/")
                  if not remote:
                      continue
                  urls.append(f"{base}/{remote}")

          if not urls:
              print("No URLs to purge.")
              sys.exit(0)

          print(f"Purging {len(urls)} URL(s) from Cloudflare zone {zone_id}:")
          for url in urls:
              print(f"  {url}")

          # Free plans allow 30 URLs per purge request.
          batch_size = 30
          endpoint = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/purge_cache"

          for i in range(0, len(urls), batch_size):
              batch = urls[i : i + batch_size]
              body = json.dumps({"files": batch}).encode("utf-8")
              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  print(f"Cloudflare purge failed ({exc.code}): {detail}", file=sys.stderr)
                  sys.exit(1)

              if not payload.get("success"):
                  print(f"Cloudflare purge unsuccessful: {payload}", file=sys.stderr)
                  sys.exit(1)

              print(f"Purged batch {i // batch_size + 1} ({len(batch)} URL(s)).")

          print("Cloudflare cache purge complete.")
          PY
