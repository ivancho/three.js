name: Upload changed files to R2

on:
  workflow_dispatch:
    inputs:
      destination_folder:
        description: Destination folder prefix in the R2 bucket
        required: true
        type: string
      compare_ref:
        description: Git ref to diff against (defaults to previous commit)
        required: false
        type: string
      path_prefix:
        description: Only upload changed files under this path prefix (optional)
        required: false
        type: string
        default: ''
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  upload:
    name: Upload changed files
    runs-on: ubuntu-latest
    # Skip when push has no configured destination folder
    if: github.event_name == 'workflow_dispatch' || vars.R2_DESTINATION_FOLDER != ''
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DESTINATION_FOLDER: ${{ github.event.inputs.destination_folder || vars.R2_DESTINATION_FOLDER }}
      PATH_PREFIX: ${{ github.event.inputs.path_prefix || vars.R2_UPLOAD_PATH_PREFIX || '' }}
    steps:
      - name: Git checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Validate configuration
        run: |
          missing=()
          [ -z "$R2_ACCOUNT_ID" ] && missing+=(R2_ACCOUNT_ID)
          [ -z "$R2_ACCESS_KEY_ID" ] && missing+=(R2_ACCESS_KEY_ID)
          [ -z "$R2_SECRET_ACCESS_KEY" ] && missing+=(R2_SECRET_ACCESS_KEY)
          [ -z "$R2_BUCKET" ] && missing+=(R2_BUCKET)
          [ -z "$DESTINATION_FOLDER" ] && missing+=(destination_folder)

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required configuration: ${missing[*]}"
            exit 1
          fi

      - name: Collect changed files
        id: changed
        env:
          COMPARE_REF: ${{ github.event.inputs.compare_ref }}
        run: |
          if [ -n "$COMPARE_REF" ]; then
            base="$COMPARE_REF"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
              base="HEAD~1"
            fi
          else
            base="HEAD~1"
          fi

          echo "Diffing against: $base"

          git diff --name-only --diff-filter=ACMR "$base" HEAD > changed_files.txt

          if [ -n "$PATH_PREFIX" ]; then
            prefix="${PATH_PREFIX%/}/"
            while IFS= read -r file; do
              case "$file" in
                "${prefix}"*) echo "$file" ;;
              esac
            done < changed_files.txt > filtered_files.txt
            mv filtered_files.txt changed_files.txt
          fi

          if [ ! -s changed_files.txt ]; then
            echo "No changed files to upload."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          cat changed_files.txt
          echo "has_files=true" >> "$GITHUB_OUTPUT"

      - name: Install AWS CLI
        if: steps.changed.outputs.has_files == 'true'
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Upload to R2
        if: steps.changed.outputs.has_files == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          destination="${DESTINATION_FOLDER%/}"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue

            key="${destination}/${file}"
            echo "Uploading ${file} -> s3://${R2_BUCKET}/${key}"

            aws s3 cp "$file" "s3://${R2_BUCKET}/${key}" \
              --endpoint-url "$endpoint"
          done < changed_files.txt
